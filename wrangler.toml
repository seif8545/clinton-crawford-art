name = "art-crawford-gallery"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# ─── ENVIRONMENT VARIABLES ───────────────────────────────────────────────────
# ADMIN_PASSWORD              — required to log into /admin
# SUPABASE_SERVICE_ROLE_KEY   — SECRET. Required to publish edits. Never commit it.
#                               Set it with:
#                               wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#                               (or in the Cloudflare Pages dashboard → Settings → Variables)
# RESEND_API_KEY              — optional, sends inquiries through Resend
# RESEND_FROM                 — optional, "From" header (default: Art Crawford <inquiries@artcrawford.com>)
# INQUIRY_WEBHOOK_URL         — optional fallback webhook if Resend isn't configured
[vars]
NEXT_PUBLIC_SITE_NAME = "Art Crawford"
NEXT_PUBLIC_ARTIST_NAME = "Dr. Clinton Crawford"

